<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WarOnPaper - Account</title>
    <link rel="icon" type="image/png" href="waronpaperlogo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #090a0d;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            background-color: #13161c;
            border: 1px solid #262b36;
            border-radius: 14px;
            padding: 36px 28px;
            width: 100%;
            max-width: 390px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
        }

        .header-logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        h1 {
            font-size: 1.5rem;
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 800;
            text-align: center;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #7e8899;
            text-align: center;
            margin-top: 4px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #1a1f2c;
            border: 1px solid #333c4d;
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            cursor: pointer;
            border: none;
            margin-top: 15px;
        }

        .btn-primary {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-danger {
            background-color: #dc2626;
            color: #ffffff;
        }

        .btn-danger:hover {
            background-color: #b91c1c;
        }

        .toggle-text {
            text-align: center;
            margin-top: 18px;
            font-size: 0.85rem;
            color: #7e8899;
        }

        .toggle-text a {
            color: #3b82f6;
            text-decoration: none;
            cursor: pointer;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        #message {
            margin-top: 15px;
            font-size: 0.85rem;
            text-align: center;
            min-height: 20px;
        }

        .error { color: #ef4444; }
        .success { color: #22c55e; }

        #logged-in-view {
            display: none;
            text-align: center;
        }

        #logged-in-view p {
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #64748b;
            text-decoration: none;
        }

        .back-link:hover {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="header-logo">
            <img src="waronpaperlogo.png" alt="WarOnPaper Logo" class="logo-img">
            <h1 id="page-title">Registrazione</h1>
            <p class="subtitle">Gestisci il tuo profilo WarOnPaper</p>
        </div>

        <!-- Vista Form (Login / Registrazione) -->
        <div id="auth-form-view">
            <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" placeholder="Il tuo nome in battaglia" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>

            <button type="button" id="action-btn" class="btn btn-primary" onclick="gestisciAccount()">Registrati</button>

            <div class="toggle-text">
                <span id="toggle-label">Hai già un account?</span> 
                <a onclick="cambiaModalita()">Accedi</a>
            </div>
        </div>

        <!-- Vista Utente Già Loggato -->
        <div id="logged-in-view">
            <p>Bentornato, <strong id="user-display-name" style="color: #3b82f6;"></strong>!</p>
            <button type="button" class="btn btn-danger" onclick="eseguiLogout()">Esci dall'account</button>
        </div>

        <div id="message"></div>

        <a href="index.html" class="back-link">← Torna al Menu Principale</a>
    </div>

    <script>
        let isLoginMode = false;

        // Controlla se c'è già un utente salvato all'avvio
        window.onload = function() {
            const savedUser = localStorage.getItem('wop_current_user');
            if (savedUser) {
                mostraVistaLoggato(savedUser);
            }
        };

        function cambiaModalita() {
            isLoginMode = !isLoginMode;
            document.getElementById('message').innerText = "";
            
            const title = document.getElementById('page-title');
            const btn = document.getElementById('action-btn');
            const toggleLabel = document.getElementById('toggle-label');
            const toggleLink = document.querySelector('.toggle-text a');

            if (isLoginMode) {
                title.innerText = "Accedi";
                btn.innerText = "Entra in Battaglia";
                toggleLabel.innerText = "Non hai un account?";
                toggleLink.innerText = "Registrati";
            } else {
                title.innerText = "Registrazione";
                btn.innerText = "Registrati";
                toggleLabel.innerText = "Hai già un account?";
                toggleLink.innerText = "Accedi";
            }
        }

        function gestisciAccount() {
            const nickname = document.getElementById('nickname').value.trim();
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            messageDiv.className = "";
            messageDiv.innerText = "";

            if (!nickname || !password) {
                messageDiv.className = "error";
                messageDiv.innerText = "Inserisci nickname e password.";
                return;
            }

            if (isLoginMode) {
                // Logica Login
                const savedPass = localStorage.getItem('wop_pass_' + nickname);
                if (savedPass && savedPass === password) {
                    localStorage.setItem('wop_current_user', nickname);
                    messageDiv.className = "success";
                    messageDiv.innerText = "Login effettuato!";
                    setTimeout(() => mostraVistaLoggato(nickname), 800);
                } else {
                    messageDiv.className = "error";
                    messageDiv.innerText = "Nickname o password errati.";
                }
            } else {
                // Logica Registrazione
                if (localStorage.getItem('wop_pass_' + nickname)) {
                    messageDiv.className = "error";
                    messageDiv.innerText = "Questo nickname è già occupato.";
                } else {
                    localStorage.setItem('wop_pass_' + nickname, password);
                    localStorage.setItem('wop_current_user', nickname);
                    messageDiv.className = "success";
                    messageDiv.innerText = "Account creato con successo!";
                    setTimeout(() => mostraVistaLoggato(nickname), 800);
                }
            }
        }

        function mostraVistaLoggato(nickname) {
            document.getElementById('auth-form-view').style.display = 'none';
            document.getElementById('logged-in-view').style.display = 'block';
            document.getElementById('user-display-name').innerText = nickname;
            document.getElementById('page-title').innerText = "Il tuo Profilo";
            document.querySelector('.subtitle').innerText = "Sei pronto per la guerra";
            document.getElementById('message').innerText = "";
        }

        function eseguiLogout() {
            localStorage.removeItem('wop_current_user');
            document.getElementById('auth-form-view').style.display = 'block';
            document.getElementById('logged-in-view').style.display = 'none';
            document.getElementById('nickname').value = "";
            document.getElementById('password').value = "";
            document.getElementById('page-title').innerText = "Registrazione";
            document.querySelector('.subtitle').innerText = "Gestisci il tuo profilo WarOnPaper";
            document.getElementById('message').innerText = "";
            isLoginMode = false;
        }
    </script>
</body>
</html>
